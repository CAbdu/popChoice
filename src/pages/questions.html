<!doctype html>
<html lang="fr">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>PopChoice - Questions</title>
        <link rel="stylesheet" href="../css/main.css">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Carter+One&display=swap" rel="stylesheet">
    </head>
    <body>
        <div class="container">
            <div class="header">
                <img class="pop_img" src="../assets/pop_img.png" alt="PopChoice">
                <h1>PopChoice</h1>
            </div>
            <div id="person-counter" class="person-counter"></div>
            <div class="content">
                <div class="question-block">
                    <label for="q1">What's your favorite movie and why?</label>
                    <textarea id="q1" rows="3"></textarea>
                </div>
            
                <div class="question-block">
                    <label for="q2">Are you in the mood for something new or a classic?</label>
                    <div class="choices-group" id="q2-group" data-question="q2">
                        <button class="choices">New</button>
                        <button class="choices">Classic</button>
                    </div>
                </div>
            
                <div class="question-block">
                    <label for="q3">Do you wanna have fun or do you want something serious</label>
                    <div class="choices-group" id="q3-group" data-question="q3">
                        <button class="choices"> Fun </button>
                        <button class="choices"> Serious </button>
                        <button class="choices"> Inspriring </button>
                        <button class="choices"> Scary </button>
                    </div>
                </div>               

                <div class="question-block">
                    <label for="q4">Which famous film person would you love to be stranded on an island with and why?</label>
                    <textarea id="q4" rows="2"></textarea>
                </div>
            
                <button class="submit-button" style="display:none">Let's Go</button>
                <button class="next-person" id="next-person">Next</button>
            </div>
        </div>
        <script type="module" src="../js/pages/questions.js"></script>
    </body>
</html>
